[general]
static=yes
writeprotect=no

[globals]
RECORD_DIR=/opt/ki-telefonassistent/recordings
AUDIO_DIR=/opt/ki-telefonassistent/audio
AGI_SCRIPT=/opt/ki-telefonassistent/run_agi.sh

[eingehend]
; === Direkter KI-Assistent (ohne IVR) ===
; Fuer Branchen die kein IVR-Menue brauchen (Gastronomie, Friseur, etc.)
; Die Begruessung wird vom AGI-Handler per TTS generiert
; DID_NUMBER wird fuer Multi-Tenant-Routing an den AGI-Handler uebergeben
exten => _X.,1,NoOp(=== Eingehender Anruf von ${CALLERID(num)} auf ${EXTEN} ===)
 same => n,Set(CALL_ID=${EPOCH}${RAND(1000,9999)})
 same => n,Set(CHANNEL(language)=de)
 same => n,Set(DID_NUMBER=${EXTEN})
 same => n,Answer()
 same => n,Wait(0.3)
 same => n,MixMonitor(${RECORD_DIR}/${CALL_ID}.wav,b)
 same => n,AGI(${AGI_SCRIPT},${CALL_ID},${CALLERID(num)})
 same => n,StopMixMonitor()
 same => n,Hangup()

[default]
exten => _X.,1,Hangup()
